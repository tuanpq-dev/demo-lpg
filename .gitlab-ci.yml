# CI cho FE – mỗi merge request / nhánh:
#   verify: lint → typecheck → unit test → build (VITE_AUTH=off) + kiểm dist/ không chứa ảnh thiết kế
#   e2e:    smoke test trình duyệt (Playwright) trên đúng bản dist/ vừa build
# Node theo .nvmrc (20). Không deploy ở đây – Vercel tự build từ repo (vercel.json).
stages: [verify, e2e]

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

default:
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
    policy: pull-push

verify:
  stage: verify
  image: node:20-alpine
  script:
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund
    - npm run lint
    - npm run typecheck
    - npm test
    - VITE_AUTH=off npm run build
    # Ảnh thiết kế không được lọt vào bản deploy công khai (CLAUDE.md mục 4).
    - '! grep -rl "figma" dist'
  artifacts:
    expire_in: 3 days
    paths: [dist/]

e2e:
  stage: e2e
  needs: [verify]
  # Phiên bản image PHẢI trùng `@playwright/test` trong package.json (ghim cứng 1.64.1).
  image: mcr.microsoft.com/playwright:v1.64.1-noble
  variables:
    CI: 'true'
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
    policy: pull
  script:
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund
    - npx playwright test
  artifacts:
    when: always
    expire_in: 7 days
    paths: [e2e-results/]
    reports:
      junit: e2e-results/junit.xml
