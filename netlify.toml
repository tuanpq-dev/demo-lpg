[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Bản demo tĩnh chưa có backend → tắt đăng nhập (phiên giả admin). Khi có API: bỏ dòng này + proxy /api/* tới backend.
  VITE_AUTH = "off"

# SPA: mọi đường dẫn (/overview, /alerts, F5…) trả index.html để React Router xử lý.
# File tĩnh có thật (assets/*.js, favicon…) vẫn được phục vụ trước vì Netlify không ép (status 200, không có "!").
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
